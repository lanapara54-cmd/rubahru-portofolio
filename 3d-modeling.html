    <style>
      * { box-sizing: border-box; }

      .grain {
        background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
        background-size: 18px 18px;
      }
      .twinkle { animation: twinkle 2.8s ease-in-out infinite; }
      @keyframes twinkle {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.2; transform: scale(0.6); }
      }
      .bubble {
        position: absolute;
        bottom: -40px;
        border-radius: 9999px;
        background: radial-gradient(circle at 32% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.15));
        pointer-events: none;
        animation: rise 14s linear infinite;
      }
      @keyframes rise {
        0% { transform: translateY(0) scale(1); opacity: 0; }
        8% { opacity: 0.8; }
        100% { transform: translateY(-110vh) scale(1.1); opacity: 0; }
      }
      .jelly-float {
        animation: jelly 7s ease-in-out infinite;
      }
      @keyframes jelly {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(-12px, -18px) scale(1.04); }
        66% { transform: translate(10px, -8px) scale(0.97); }
      }
      .fish-swim {
        animation: fish 18s linear infinite;
      }
      @keyframes fish {
        0% { transform: translate(110vw, 0) scaleX(1); }
        49.9% { transform: translate(-10vw, 0) scaleX(1); }
        50% { transform: translate(-10vw, 0) scaleX(-1); }
        100% { transform: translate(110vw, 0) scaleX(-1); }
      }
      .card-lift { transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; }
      .card-lift:hover {
        transform: translateY(-8px) rotate(-0.5deg);
        box-shadow: 0 26px 44px -18px rgba(4,38,61,0.4);
      }
      .card-lift img {
        transition: transform 0.4s ease;
      }
      .card-lift:hover img {
        transform: scale(1.08);
      }
      .back-pill {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .back-pill:hover {
        transform: translateY(-3px) rotate(-2deg);
        box-shadow: 0 5px 0 rgba(4,38,61,0.3);
      }
    </style>

          <h1 class="mt-6 text-5xl font-bold leading-[1.05] text-[#eaf7ff] md:text-7xl" style="font-family: Luckiest Guy, cursive; text-shadow: 4px 4px 0 rgba(4,38,61,0.7), 0 0 30px rgba(72,202,228,0.35);">3D MODELING GALLERY 🧊</h1>
          <p class="mx-auto mt-4 max-w-xl text-base font-semibold text-[#04263d]/90 md:text-lg">3D personal visualization.</p>
        </div>        <div class="mt-14 flex flex-wrap items-center gap-3">
          <span class="inline-flex items-center gap-2 rounded-full border-[3px] border-[#04263d] px-4 py-1.5 text-xs font-extrabold uppercase tracking-[0.25em] text-[#04263d]" style="background:#5eead4">3D MODELING 🧊</span>

            <figcaption class="flex items-center justify-between gap-2 p-4">

          <figure class="gallery-item card-lift cursor-pointer overflow-hidden rounded-3xl border-[3px] border-[#04263d] bg-white shadow-[8px_8px_0_rgba(4,38,61,0.35)]">
            <div class="grid aspect-square place-items-center overflow-hidden border-b-[3px] border-[#04263d] bg-white"><img alt="CHAR SHIRMP" class="h-full w-full object-cover" src="3D%20MODELING/CHAR%20SHIRMP.png"/></div>
            <figcaption class="flex items-center justify-between gap-2 p-4">
              <span class="truncate font-extrabold uppercase tracking-wide text-[#04263d]">CHAR SHIRMP</span>
              <span class="shrink-0 rounded-full bg-[#5eead4] px-2.5 py-0.5 text-[10px] font-extrabold text-[#04263d]">🧊</span>
            </figcaption>
          </figure>
          <figure class="gallery-item card-lift cursor-pointer overflow-hidden rounded-3xl border-[3px] border-[#04263d] bg-white shadow-[8px_8px_0_rgba(4,38,61,0.35)]">
            <div class="grid aspect-square place-items-center overflow-hidden border-b-[3px] border-[#04263d] bg-white"><img alt="DORAEMON" class="h-full w-full object-cover" src="3D%20MODELING/DORAEMON.png"/></div>

            <div class="grid aspect-square place-items-center overflow-hidden border-b-[3px] border-[#04263d] bg-white"><img alt="PLANTON" class="h-full w-full object-cover" src="3D%20MODELING/PLANTON.png"/></div>

    <div id="lb" class="fixed inset-0 z-[100] hidden items-center justify-center bg-[#03202f]/95 p-4 backdrop-blur-sm md:p-12">
      <button id="lbClose" class="absolute right-4 top-4 grid h-11 w-11 place-items-center rounded-full border-[3px] border-[#04263d] bg-[#ffd166] text-2xl font-extrabold text-[#04263d] shadow-[0_5px_0_rgba(0,0,0,0.4)] transition hover:-translate-y-1">&times;</button>
      <button id="lbPrev" class="absolute left-3 top-1/2 z-10 grid h-12 w-12 -translate-y-1/2 place-items-center rounded-full border-[3px] border-[#04263d] bg-[#eaf7ff] text-3xl font-extrabold text-[#04263d] shadow-[0_5px_0_rgba(0,0,0,0.4)] transition hover:-translate-y-[calc(50%+4px)]">&lsaquo;</button>
      <button id="lbNext" class="absolute right-3 top-1/2 z-10 grid h-12 w-12 -translate-y-1/2 place-items-center rounded-full border-[3px] border-[#04263d] bg-[#eaf7ff] text-3xl font-extrabold text-[#04263d] shadow-[0_5px_0_rgba(0,0,0,0.4)] transition hover:-translate-y-[calc(50%+4px)]">&rsaquo;</button>
      <figure class="flex max-h-full w-full max-w-6xl flex-col items-center">
        <img id="lbImg" class="max-h-[85vh] w-auto max-w-full rounded-3xl border-[3px] border-[#48cae4] bg-[#0a3d57] object-contain shadow-[0_0_60px_rgba(72,202,228,0.4)]" alt=""/>
        <figcaption id="lbCap" class="mt-4 text-center font-extrabold uppercase tracking-[0.2em] text-[#eaf7ff] md:text-lg"></figcaption>
      </figure>
      <p id="lbCount" class="absolute bottom-5 left-1/2 -translate-x-1/2 rounded-full border-[3px] border-[#04263d] bg-[#eaf7ff] px-4 py-1 text-xs font-extrabold text-[#04263d]">1 / 1</p>
    </div>

    <script>
      var gallery = [{"src":"3D%20MODELING/CHAR%20ASA.png","cap":"CHAR ASA"},{"src":"3D%20MODELING/CHAR%20SHIRMP.png","cap":"CHAR SHIRMP"},{"src":"3D%20MODELING/DORAEMON.png","cap":"DORAEMON"},{"src":"3D%20MODELING/PLANTON.png","cap":"PLANTON"}];
      var idx = 0;
      var lb = document.getElementById('lb');
      var lbImg = document.getElementById('lbImg');
      var lbCap = document.getElementById('lbCap');
      var lbCount = document.getElementById('lbCount');
      function render(){
        var g = gallery[idx];
        lbImg.src = g.src;
        lbImg.alt = g.cap;
        lbCap.textContent = g.cap;
        lbCount.textContent = (idx + 1) + ' / ' + gallery.length;
      }
      function openLb(i){
        idx = i;
        render();
        lb.classList.remove('hidden');
        lb.classList.add('flex');
        document.body.style.overflow = 'hidden';
      }
      function closeLb(){
        lb.classList.add('hidden');
        lb.classList.remove('flex');
        document.body.style.overflow = '';
      }
      function step(d){
        idx = (idx + d + gallery.length) % gallery.length;
        render();
      }
      var items = document.querySelectorAll('.gallery-item');
      items.forEach(function(el, i){
        el.addEventListener('click', function(ev){
          ev.preventDefault();
          openLb(i);
        });
      });
      document.getElementById('lbClose').addEventListener('click', closeLb);
      document.getElementById('lbPrev').addEventListener('click', function(){ step(-1); });
      document.getElementById('lbNext').addEventListener('click', function(){ step(1); });
      lb.addEventListener('click', function(ev){ if(ev.target === lb){ closeLb(); } });
      document.addEventListener('keydown', function(ev){
        if(ev.key === 'Escape'){ closeLb(); }
        else if(ev.key === 'ArrowLeft'){ if(!lb.classList.contains('hidden')){ step(-1); } }
        else if(ev.key === 'ArrowRight'){ if(!lb.classList.contains('hidden')){ step(1); } }
      });
    </script>
